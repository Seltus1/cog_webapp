<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <!-- Door body -->
  <rect x="5" y="5" width="110" height="190" rx="5" fill="#30a030" stroke="#1a6a1a" stroke-width="3"/>
  <!-- Doorknob -->
  <circle cx="91" cy="108" r="5" fill="#1a6a1a" opacity="0.6"/>
  <!-- 6 circles in 3x2 grid -->
  <!-- Row 1: y=78, cols x=27,60,93 -->
  <circle cx="27" cy="78" r="16" fill="white"/>
  <text x="27" y="83" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">1</text>
  <circle cx="60" cy="78" r="16" fill="white"/>
  <text x="60" y="83" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">2</text>
  <circle cx="93" cy="78" r="16" fill="white"/>
  <text x="93" y="83" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">3</text>
  <!-- Row 2: y=138 -->
  <circle cx="27" cy="138" r="16" fill="white"/>
  <text x="27" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">4</text>
  <circle cx="60" cy="138" r="16" fill="white"/>
  <text x="60" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">5</text>
  <circle cx="93" cy="138" r="16" fill="white"/>
  <text x="93" y="143" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#30a030" text-anchor="middle">6</text>
</svg>
