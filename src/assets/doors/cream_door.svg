<svg xmlns="http://www.w3.org/2000/svg" width="120" height="200" viewBox="0 0 120 200">
  <!-- Door body -->
  <rect x="5" y="5" width="110" height="190" rx="5" fill="#fdf6e0" stroke="#d4c4a8" stroke-width="3"/>
  <!-- Doorknob -->
  <circle cx="91" cy="108" r="5" fill="#d4c4a8" opacity="0.8"/>
  <!-- Diamond 1 at (38, 80): half-width=15, half-height=17 -->
  <polygon points="38,63 53,80 38,97 23,80" fill="white" stroke="#d4c4a8" stroke-width="1.5"/>
  <text x="38" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b0966a" text-anchor="middle">1</text>
  <!-- Diamond 2 at (82, 80) -->
  <polygon points="82,63 97,80 82,97 67,80" fill="white" stroke="#d4c4a8" stroke-width="1.5"/>
  <text x="82" y="85" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b0966a" text-anchor="middle">2</text>
  <!-- Diamond 3 at (38, 148) -->
  <polygon points="38,131 53,148 38,165 23,148" fill="white" stroke="#d4c4a8" stroke-width="1.5"/>
  <text x="38" y="153" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b0966a" text-anchor="middle">3</text>
  <!-- Diamond 4 at (82, 148) -->
  <polygon points="82,131 97,148 82,165 67,148" fill="white" stroke="#d4c4a8" stroke-width="1.5"/>
  <text x="82" y="153" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#b0966a" text-anchor="middle">4</text>
</svg>
